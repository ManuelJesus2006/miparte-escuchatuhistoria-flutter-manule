name: escucha_tu_historia_front
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  device_info_plus: ^13.1.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_markdown: ^0.7.7+1
  go_router: ^17.1.0
  google_maps_flutter: ^2.16.0
  google_nav_bar: ^5.0.7
  http: ^1.6.0
  lottie: ^3.3.3
  provider: ^6.1.5+1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background_color: "#FFFFFF"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
